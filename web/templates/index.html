<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Dubber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <div class="container">
        <div class="glass-card">
            <h1>AI Video Dubbing</h1>
            <p class="subtitle">Translate and dub any video to Hindi in minutes.</p>

            <div class="input-section">
                <div class="input-tabs">
                    <button class="tab-btn active" data-tab="url">YouTube URL</button>
                    <button class="tab-btn" data-tab="file">Upload Video</button>
                </div>
                
                <div class="tab-content active" id="url-tab">
                    <div class="input-group">
                        <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                    </div>
                </div>
                
                <div class="tab-content" id="file-tab">
                    <div class="file-upload-area" id="drop-zone">
                        <input type="file" id="video-file" accept="video/*" hidden>
                        <div class="file-upload-content" id="file-upload-content">
                            <span class="upload-icon">📁</span>
                            <p>Click to select or drag video here</p>
                            <p class="file-name" id="file-name"></p>
                        </div>
                    </div>
                </div>
                
                <button id="dub-btn">Dub Video</button>
            </div>

            <!-- Scroll Controls -->
            <div class="scroll-controls">
                <button id="scroll-up" class="scroll-btn" title="Scroll Up">▲</button>
                <button id="scroll-down" class="scroll-btn" title="Scroll Down">▼</button>
            </div>

            <!-- Progress Section -->
            <div id="status-container" class="hidden">
                <div class="stage-label">
                    <span id="stage-name">Processing...</span>
                    <span id="progress-pct">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p id="status-text" class="status-message">Initializing...</p>
                <p id="eta-text" class="eta-label"></p>
                <button id="stop-btn" class="danger-btn">Stop</button>
            </div>

            <!-- Result Section -->
            <div id="result-container" class="hidden">
                <div class="success-badge">✅ Dubbing Complete!</div>
                <video id="result-video" controls width="100%"></video>
                <div class="download-buttons">
                    <a id="download-btn" href="#" download class="secondary-btn">⬇ Download Video</a>
                    <a id="download-audio-btn" href="#" download class="secondary-btn">🎵 Download Audio</a>
                </div>
            </div>

            <!-- Error Section -->
            <div id="error-container" class="hidden">
                <p id="error-text" class="error-text"></p>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('youtube-url');
        const videoFileInput = document.getElementById('video-file');
        const fileNameDisplay = document.getElementById('file-name');
        const dropZone = document.getElementById('drop-zone');
        const fileUploadContent = document.getElementById('file-upload-content');
        const dubBtn = document.getElementById('dub-btn');
        const statusContainer = document.getElementById('status-container');
        const stageName = document.getElementById('stage-name');
        const progressPct = document.getElementById('progress-pct');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const etaText = document.getElementById('eta-text');
        const resultContainer = document.getElementById('result-container');
        const resultVideo = document.getElementById('result-video');
        const downloadBtn = document.getElementById('download-btn');
        const downloadAudioBtn = document.getElementById('download-audio-btn');
        const errorContainer = document.getElementById('error-container');
        const errorText = document.getElementById('error-text');
        const stopBtn = document.getElementById('stop-btn');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const scrollUpBtn = document.getElementById('scroll-up');
        const scrollDownBtn = document.getElementById('scroll-down');

        let pollingInterval = null;
        let selectedFile = null;
        let activeTab = 'url';

        // Tab switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(`${activeTab}-tab`).classList.add('active');
            });
        });

        // File upload
        dropZone.addEventListener('click', () => videoFileInput.click());
        
        videoFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                fileUploadContent.innerHTML = `<span class="upload-icon">✅</span><p>Selected:</p><p class="file-name">${selectedFile.name}</p>`;
            }
        });

        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                fileUploadContent.innerHTML = `<span class="upload-icon">✅</span><p>Selected:</p><p class="file-name">${selectedFile.name}</p>`;
            }
        });

        dubBtn.addEventListener('click', async () => {
            let formData = new FormData();
            
            if (activeTab === 'url') {
                const url = urlInput.value.trim();
                if (!url) return;
                formData.append('url', url);
            } else {
                if (!selectedFile) return;
                formData.append('file', selectedFile);
            }

            // Reset UI
            errorContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');
            statusContainer.classList.remove('hidden');
            dubBtn.disabled = true;
            stopBtn.disabled = false;
            setProgress(0, 'Initializing', 'Sending request to server...', null);

            try {
                const response = await fetch('/api/dub', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to start job');
                pollingInterval = setInterval(checkStatus, 2000);
            } catch (err) {
                showError(err.message);
            }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            stopBtn.textContent = 'Stopping...';
            try {
                await fetch('/api/stop', { method: 'POST' });
            } catch (err) {
                console.error('Error stopping task:', err);
            }
        });

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.status === 'processing') {
                    setProgress(data.progress || 0, data.stage || 'Processing', data.message, data.eta_seconds);
                } else if (data.status === 'completed') {
                    clearInterval(pollingInterval);
                    setProgress(100, 'Done', 'Finished!', 0);
                    setTimeout(() => showSuccess(data.output_file), 600);
                } else if (data.status === 'error' || data.status === 'cancelled') {
                    clearInterval(pollingInterval);
                    if (data.status === 'cancelled') {
                        showCancelled();
                    } else {
                        showError(data.message);
                    }
                }
            } catch (err) {
                console.error('Error fetching status:', err);
            }
        }

        function setProgress(pct, stage, message, etaSec) {
            progressBar.style.width = pct + '%';
            progressPct.textContent = Math.round(pct) + '%';
            stageName.textContent = stage;
            statusText.textContent = message;

            if (etaSec !== null && etaSec !== undefined && etaSec > 0) {
                etaText.textContent = '⏱ Est. time remaining: ' + formatETA(etaSec);
            } else if (etaSec === 0) {
                etaText.textContent = '✅ Almost done!';
            } else {
                etaText.textContent = '';
            }
        }

        function formatETA(seconds) {
            if (seconds < 60) return `${seconds}s`;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        function showSuccess(filename) {
            statusContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            dubBtn.disabled = false;
            const videoUrl = `/outputs/${filename}?t=${Date.now()}`;
            resultVideo.src = videoUrl;
            downloadBtn.href = videoUrl;
            downloadBtn.download = filename;
            
            const audioUrl = `/outputs/hindi.mp3?t=${Date.now()}`;
            downloadAudioBtn.href = audioUrl;
            downloadAudioBtn.download = 'hindi.mp3';
        }

        function showError(msg) {
            statusContainer.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            errorText.textContent = msg;
            dubBtn.disabled = false;
        }

        function showCancelled() {
            statusContainer.classList.add('hidden');
            errorContainer.classList.remove('hidden');
            errorText.textContent = "Task was cancelled.";
            dubBtn.disabled = false;
        }

        // Scroll controls
        scrollUpBtn.addEventListener('click', () => {
            window.scrollBy({ top: -200, behavior: 'smooth' });
        });

        scrollDownBtn.addEventListener('click', () => {
            window.scrollBy({ top: 200, behavior: 'smooth' });
        });
    </script>
</body>
</html>
